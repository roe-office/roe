[package]
name = "roe-fontconfig-sys"
version = "6.0.1"
edition = "2021"
rust-version = "1.77"
authors = [
    "Austin Bonander <austin.bonander@gmail.com>",
    "The Servo Project Developers",
    "YesLogic Pty. Ltd. <info@yeslogic.com>"
]
license = "MIT"

description = "Vendored fork of yeslogic-fontconfig-sys, renamed to avoid Cargo feature-unification conflicts with the upstream crate when both are present in the same dependency graph (see roe-ext_progress_v199.md for context). Source unchanged from yeslogic-fontconfig-sys 6.0.1 except for this Cargo.toml."
keywords = ["font", "bindings", "fontconfig", "sys"]
categories = ["text-processing"]

homepage = "https://github.com/yeslogic/fontconfig-rs"
repository = "https://github.com/yeslogic/fontconfig-rs"

# 有意去掉 links = "fontconfig"：这是一份改名 fork，专供本仓库 vendor 的
# fontique 使用，与 crates.io 上原版 yeslogic-fontconfig-sys（被 slint-build
# 依赖）刻意保持包名不同、不共享同一个 native-lib link 槽位，避免 Cargo
# feature unification 在两条 fontique 链之间产生不确定的编译单元合并/分裂。
# 不声明 links 表示不做原生库互斥检查，走 pkg-config 常规链接即可。

[lib]
name = "fontconfig_sys"

[dependencies]
dlib = "0.5.0"
once_cell = "1.9.0"

[features]
dlopen = []

[build-dependencies]
pkg-config = "0.3"
